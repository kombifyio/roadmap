name: Public triage (shadow)
run-name: Public triage ${{ github.event.issue.number || github.event.discussion.number }}

# Decides, in shadow mode, which reply a new public item would get. It posts
# nothing: the job holds no write permission and no secret. It proves itself
# to the Gateway with a short-lived GitHub OIDC token, sends the item to one
# route, validates the typed answer, renders the reply it would post from
# fixed templates and keeps a decision record for every outcome (decided,
# deferred, failed) with hashes and typed values, never the title or body.
# Generated by the kombify community kit; do not edit by hand.

on:
  issues:
    types: [opened]
  discussion:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  group: public-triage-${{ github.event.issue.number || github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Decide in shadow mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/public-triage

      - name: Decide the reply
        id: triage
        env:
          TRIAGE_ENDPOINT: https://api.kombify.io/v1/ai/public-triage/decide
        run: node .github/public-triage/triage.mjs

      - name: Keep the decision record
        if: ${{ !cancelled() && steps.triage.outputs.file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.triage.outputs.artifact }}
          path: ${{ steps.triage.outputs.file }}
          retention-days: 30
          if-no-files-found: error
          overwrite: true
